name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:ffmpeg -- linux
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:ffmpeg
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SquashForge-windows
          # latest.yml and the blockmap let installed copies update themselves.
          path: |
            release/*/*.exe
            release/*/latest.yml
            release/*/*.blockmap
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*/*.exe
            release/*/latest.yml
            release/*/*.blockmap

  mac:
    name: macOS disk images
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:ffmpeg -- mac-arm64
      - run: npm run fetch:ffmpeg -- mac-x64
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SquashForge-mac
          path: release/*/*.dmg
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*/*.dmg

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:ffmpeg -- linux
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: SquashForge-linux
          path: |
            release/*/*.AppImage
            release/*/*.deb
            release/*/latest-linux.yml
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*/*.AppImage
            release/*/*.deb
            release/*/latest-linux.yml
